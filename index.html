<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kalbela Clone</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Advertisement -->
    <section id="top-ad">
      <div class="container">
        <img id="adBanner" src="" alt="Advertisement" class="img-fluid w-100" />
      </div>
    </section>

    <!-- Header -->
    <header class="main-header">
      <div class="container">
        <div class="row align-items-center py-3">
          <!-- Logo -->
          <div class="col-lg-3">
            <a href="#">
              <img src="images/logo.png" alt="Logo" class="img-fluid logo" />
            </a>
          </div>

          <!-- Middle Menu -->
          <div class="col-lg-7">
            <div class="d-flex justify-content-center gap-4 header-menu">
              <a href="#">
                <i class="bi bi-newspaper"></i>
                আজকের পত্রিকা
              </a>

              <a href="#">
                <i class="bi bi-file-earmark-text"></i>
                ই-পেপার
              </a>

              <a href="#">
                <i class="bi bi-book"></i>
                ম্যাগাজিন
              </a>

              <a href="#">
                <i class="bi bi-archive"></i>
                আর্কাইভ
              </a>

              <a href="#">
                <i class="bi bi-hand-thumbs-up-fill"></i>
                সোশ্যাল মিডিয়া
              </a>

              <a href="#">
                <i class="bi bi-translate"></i>
                বাংলা কনভার্টার
              </a>
            </div>
          </div>

          <!-- Right Icons -->
          <div class="col-lg-2">
            <div class="d-flex justify-content-end gap-3 header-icons">
              <button class="icon-btn">
                <i class="bi bi-search"></i>
              </button>

              <button class="icon-btn position-relative">
                <i class="bi bi-bell"></i>

                <span class="notification-dot"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
